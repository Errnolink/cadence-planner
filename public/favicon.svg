<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- binding rings -->
  <rect x="19" y="11" width="10" height="6" rx="3" fill="#0d0d10"/>
  <rect x="35" y="11" width="10" height="6" rx="3" fill="#0d0d10"/>
  <!-- calendar body -->
  <rect x="8" y="16" width="48" height="42" rx="9" fill="#0d0d10"/>
  <!-- header band (rounded top, square bottom) -->
  <rect x="8" y="16" width="48" height="14" rx="9" fill="#ff3c7e"/>
  <rect x="8" y="24" width="48" height="6" fill="#ff3c7e"/>
  <!-- grid cells: 3 cols x 2 rows, middle cell = "today" -->
  <rect x="16" y="38" width="10" height="7" rx="2" fill="#2b2b33"/>
  <rect x="27" y="38" width="10" height="7" rx="2" fill="#2b2b33"/>
  <rect x="38" y="38" width="10" height="7" rx="2" fill="#2b2b33"/>
  <rect x="16" y="46" width="10" height="7" rx="2" fill="#2b2b33"/>
  <rect x="27" y="46" width="10" height="7" rx="2" fill="#ff3c7e"/>
  <rect x="38" y="46" width="10" height="7" rx="2" fill="#2b2b33"/>
  <!-- pen, diagonal -->
  <g transform="rotate(-45 32 32)">
    <rect x="18" y="29.5" width="30" height="5" rx="2.5" fill="#f5f5f7"/>
    <path d="M48 27.5 L57 32 L48 36.5 Z" fill="#f5f5f7"/>
    <rect x="12" y="28.5" width="7" height="7" rx="3" fill="#ff3c7e"/>
  </g>
</svg>
