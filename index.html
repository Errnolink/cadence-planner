<!doctype html>
<html lang="en" data-theme="nerv">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <script>
      // Apply saved theme/mode before first paint to avoid FOUC
      try {
        var t = localStorage.getItem('cadence-theme')
        if (t) document.documentElement.setAttribute('data-theme', t.replace(/^"|"$/g, ''))
        var s = JSON.parse(localStorage.getItem('cadence_settings') || 'null')
        if (s && s.themeMode) document.documentElement.setAttribute('data-mode', s.themeMode)
      } catch (e) {}
    </script>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://va.vercel-scripts.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://vitals.vercel-insights.com ws: http:; img-src 'self' data: blob:; object-src 'none'; base-uri 'self';" />
    <meta name="description" content="Cadence — Academic planner. Track your timetable, grades, and GPA across semesters." />
    <title>Cadence</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
